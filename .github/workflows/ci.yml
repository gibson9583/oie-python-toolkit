name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Test the SDK on supported Python versions
        env:
          PYTHONPATH: python-sdk
        run: python -m unittest discover -s python-sdk/tests -v

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21', '25']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Verify source and release-tag versions
        run: python tools/release_contract.py
      - name: Stage the pinned stock OIE compile inputs
        run: python tools/ci_engine.py --version 4.6.0 --output "$RUNNER_TEMP/oie.tar.gz" --stage-api
      - name: Build the package and run JVM and web tests
        run: mvn -B -ntp verify
      - name: Validate the installable package and release contracts
        run: |
          python tools/inspect_plugin.py --report target/package-inspection.json
          python -m unittest discover -s tools -p 'test_*.py' -v
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-evidence-jdk-${{ matrix.java }}
          path: |
            target/*inputs*.json
            target/engine-input-*.json
            target/package-inspection.json
            **/target/surefire-reports/
            server/target/runtime-evidence/
            server/target/integration-evidence/
            server/*.log
      - name: Retain the canonical package built on JDK 17
        if: matrix.java == '17'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-toolkit-package
          path: package/target/oie-python-toolkit-*.zip
          if-no-files-found: error

  engine:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: ['4.6.0', '4.7.0']
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-toolkit-package
          path: package/target
      - name: Fetch the pinned stock engine
        env:
          ENGINE_VERSION: ${{ matrix.engine }}
        run: python tools/ci_engine.py --version "$ENGINE_VERSION" --output "$RUNNER_TEMP/oie.tar.gz"
      - name: Qualify native filters, transformers, Functions, Reader and Writer
        run: |
          python tools/run_return_isolated.py --engine "$RUNNER_TEMP/oie.tar.gz" \
            --java-home "$JAVA_HOME" --python "$(command -v python)" --evidence validation/return
          python tools/run_editor_services_isolated.py --engine "$RUNNER_TEMP/oie.tar.gz" \
            --java-home "$JAVA_HOME" --python "$(command -v python)" --evidence validation/editor
      - name: Retain evidence and deduplicated runtime inputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: engine-${{ matrix.engine }}-python-${{ matrix.python }}
          path: |
            validation/
            target/engine-input-*.json
            !validation/**/owned-runtime/**

  browser:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OIE_WEB_HOST: ${{ github.workspace }}/.ci-web-host
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check out the shipped Web Administrator 1.2.0 source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: gibson9583/oie-web-client
          ref: 037990b69dcb5f2dbcd6d36af0f441bb4d20c039
          path: .ci-web-host
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.18.0'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-toolkit-package
          path: package/target
      - name: Build the pinned Web Administrator and install Chromium
        working-directory: .ci-web-host
        run: |
          npm ci
          npm run build --workspace web-administrator
          npx playwright install --with-deps chromium
      - name: Install browser test dependencies
        working-directory: package/webadmin
        run: npm ci
      - name: Use the exact editor assets from the tested package
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile(next(Path('package/target').glob('oie-python-toolkit-*.zip'))) as package:
              for name in ('plugin.js', 'python-language.json', 'python-language.LICENSE.txt'):
                  Path('package/webadmin/web', name).write_bytes(package.read('oie-python-toolkit/webadmin/web/' + name))
          PYTHON
      - name: Exercise all editor roles, read-only Functions and responsive controls
        working-directory: package/webadmin
        run: |
          OIE_WEB_ART="$GITHUB_WORKSPACE/validation/browser-editors" node test/browser-python-editors.mjs
          OIE_WEB_ART="$GITHUB_WORKSPACE/validation/browser-functions" node test/browser-code-template.mjs
          OIE_WEB_ART="$GITHUB_WORKSPACE/validation/browser-ui" node test/browser-ui-cleanup.mjs
      - name: Qualify Monaco tooling against a live isolated engine
        run: |
          python tools/ci_engine.py --version 4.7.0 --output "$RUNNER_TEMP/oie.tar.gz"
          python tools/run_editor_services_isolated.py --engine "$RUNNER_TEMP/oie.tar.gz" \
            --java-home "$JAVA_HOME" --python "$(command -v python)" --evidence validation/browser-live-editor
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-evidence
          path: |
            validation/
            !validation/**/owned-runtime/**
